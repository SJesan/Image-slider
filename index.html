<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#142d4c] min-h-screen flex items-center justify-center flex-col">
    <h1 class="text-[50px] text-[#ececec]">Image Slider</h1>

    <div class="w-[700px] overflow-hidden relative bg-[#385170] rounded-lg">
        <div class=" flex transition-transform duration-800 ease-in-out slider-wrapper">
            <img src="images/image 1.jpg" class="w-[700px] flex-shrink-0">
            <img src="images/image 2.jpg" class="w-[700px] flex-shrink-0">
            <img src="images/image 3.jpg" class="w-[700px] flex-shrink-0">
            <img src="images/image 4.jpg" class="w-[700px] flex-shrink-0">
            <img src="images/image 5.jpg" class="w-[700px] flex-shrink-0">
        </div>

        <div class="flex justify-between absolute top-1/2 left-0 w-full px-4 -translate-y-1/2">
            <button class="previous bg-[#9fd3c7] rounded-lg hover:scale-110">
                <img src="svgs/previous.svg" alt="">
            </button>
            <button class="next bg-[#9fd3c7] rounded-lg hover:scale-110">
                <img src="svgs/next.svg" alt="">
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
